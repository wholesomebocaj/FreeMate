<!doctype html>
<html lang="en">
    <head>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-8KV5HPVRZL"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'G-8KV5HPVRZL');
        </script>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Courses | FreeMate</title>
        <link rel="icon" type="image/png" href="/static/assets/logo/favicon.png" />
        <link rel="apple-touch-icon" href="/static/assets/logo/favicon.png" />
        <link rel="stylesheet" href="/static/styles/main.css" />
    </head>
    <body>
        <header class="site-header">
            <nav class="navbar" aria-label="Main navigation">
                <a class="brand" href="/">FreeMate</a>
                <div class="nav-links">
                    <a href="/">Home</a>
                    <a href="/lessons" aria-current="page">Lessons</a>
                    <a href="/openings">Openings</a>
                    <a href="/practice">Practice</a>
                    <a href="/review">Review</a>
                </div>
            </nav>
        </header>

        <main class="course-browser-shell course-library-shell">
            <section class="course-browser-hero">
                <div>
                    <p class="eyebrow">Courses</p>
                    <h1>Browse the course library.</h1>
                    <p>
                        Filter by level, topic, color, and progress to find the
                        next lesson path that fits your current game.
                    </p>
                </div>
                <div class="coach-stats" id="progress">
                    <span id="progress-count">0 of 0 lessons complete</span>
                    <div class="progress-track" aria-hidden="true">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
            </section>

            <section class="course-library-toolbar" id="course-library-toolbar" aria-label="Course filters">
                <label class="course-filter-field course-filter-search">
                    <span>Search</span>
                    <input
                        id="course-search"
                        type="search"
                        name="course-search"
                        placeholder="Search courses"
                        autocomplete="off"
                    />
                </label>
                <label class="course-filter-field">
                    <span>Level</span>
                    <select id="course-filter-bracket" name="course-filter-bracket"></select>
                </label>
                <label class="course-filter-field">
                    <span>Topic</span>
                    <select id="course-filter-topic" name="course-filter-topic"></select>
                </label>
                <label class="course-filter-field">
                    <span>Color</span>
                    <select id="course-filter-color" name="course-filter-color"></select>
                </label>
                <label class="course-filter-field">
                    <span>Type</span>
                    <select id="course-filter-type" name="course-filter-type"></select>
                </label>
                <label class="course-filter-field">
                    <span>Status</span>
                    <select id="course-filter-status" name="course-filter-status"></select>
                </label>
                <label class="course-filter-field">
                    <span>Sort by</span>
                    <select id="course-sort" name="course-sort"></select>
                </label>
                <button class="button secondary course-filter-reset" id="course-filter-reset" type="button">
                    Reset
                </button>
            </section>

            <section class="course-library-summary">
                <p id="course-library-count">0 courses shown</p>
                <div class="course-library-tags" id="course-library-tags"></div>
            </section>

            <section class="course-library-list" id="course-library" aria-label="Courses"></section>
        </main>

        <script type="module" src="/static/components/mobile-nav.js"></script>
        <script type="module" src="/static/components/auth-ui.js"></script>
        <script src="/static/script.js?v=20260525a"></script>
    </body>
</html>
