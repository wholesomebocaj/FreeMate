<!doctype html>
<html lang="en">
    <head>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-8KV5HPVRZL"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'G-8KV5HPVRZL');
        </script>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Opening Trainer | FreeMate</title>
        <link rel="icon" type="image/png" href="/static/assets/logo/favicon.png" />
        <link rel="apple-touch-icon" href="/static/assets/logo/favicon.png" />
        <link
            rel="stylesheet"
            href="/static/vendor/chessground/chessground.base.css"
        />
        <link
            rel="stylesheet"
            href="/static/vendor/chessground/chessground.cburnett.css"
        />
        <link rel="stylesheet" href="/static/styles/main.css" />
    </head>
    <body data-opening-page="trainer">
        <header class="site-header lesson-mode-header">
            <nav class="navbar" aria-label="Main navigation">
                <a class="brand" href="/">FreeMate</a>
                <div class="nav-links">
                    <a href="/">Home</a>
                    <a href="/lessons">Lessons</a>
                    <a href="/openings" aria-current="page">Openings</a>
                    <a href="/practice">Practice</a>
                    <a href="/review">Review</a>
                </div>
            </nav>
        </header>

        <main class="opening-trainer-shell">
            <aside class="opening-trainer-panel">
                <p class="eyebrow">Opening line</p>
                <h2 id="trainer-title">Loading</h2>
                <details class="mobile-panel" data-mobile-collapse open>
                    <summary>Roadmap</summary>
                    <div class="mobile-panel-body">
                        <div id="trainer-roadmap" class="opening-roadmap"></div>
                    </div>
                </details>
            </aside>

            <section class="opening-trainer-board-card">
                <div class="lesson-title-row compact">
                    <div>
                        <p class="eyebrow" id="trainer-kicker">Guided line</p>
                        <h3 id="trainer-prompt">Loading trainer...</h3>
                    </div>
                    <span
                        id="trainer-status"
                        class="lesson-step-progress-state waiting"
                        >In progress</span
                    >
                </div>
                <div
                    id="opening-board"
                    class="practice-board opening-board"
                    aria-label="Opening trainer chessboard"
                ></div>
                <p
                    id="trainer-feedback"
                    class="lesson-board-feedback opening-board-status"
                    aria-live="polite"
                >
                    Ready.
                </p>
            </section>

            <aside class="opening-trainer-panel">
                <details class="mobile-panel" data-mobile-collapse open>
                    <summary>Coach notes</summary>
                    <div class="mobile-panel-body">
                        <h2 id="trainer-note-title">Current idea</h2>
                        <p id="trainer-explanation">
                            Follow the guided line one move at a time.
                        </p>
                        <div class="opening-note-block">
                            <h3>Key ideas</h3>
                            <ul id="trainer-ideas"></ul>
                        </div>
                        <div class="opening-note-block">
                            <h3>Common mistakes</h3>
                            <ul id="trainer-mistakes"></ul>
                        </div>
                    </div>
                </details>
            </aside>
        </main>

        <script type="module" src="/static/components/mobile-panels.js"></script>
        <script type="module" src="/static/components/mobile-nav.js"></script>
        <script type="module" src="/static/components/auth-ui.js"></script>
        <script type="module" src="/static/openings.js"></script>
    </body>
</html>
