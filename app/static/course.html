<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Course | FreeMate</title>
        <link rel="stylesheet" href="/static/styles/main.css" />
    </head>
    <body>
        <header class="site-header">
            <nav class="navbar" aria-label="Main navigation">
                <a class="brand" href="/">FreeMate</a>
                <div class="nav-links">
                    <a href="/">Home</a>
                    <a href="/lessons">Lessons</a>
                    <a href="/openings">Openings</a>
                    <a href="/practice">Practice</a>
                    <a href="/review">Review</a>
                </div>
            </nav>
        </header>

        <main class="course-browser-shell">
            <section class="course-browser-hero">
                <div>
                    <p class="eyebrow">Course dashboard</p>
                    <h1 id="course-title">Loading course...</h1>
                    <p id="course-description">Preparing your lesson list.</p>
                    <div class="hero-actions">
                        <a
                            class="button primary"
                            id="continue-learning"
                            href="#"
                            >Continue Learning</a
                        >
                        <a class="button secondary" href="/lessons"
                            >All Courses</a
                        >
                    </div>
                </div>
                <div class="coach-stats">
                    <span id="progress-count">0 of 0 complete</span>
                    <div class="progress-track" aria-hidden="true">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
            </section>

            <section
                class="roadmap-section compact"
                aria-label="Course roadmap"
            >
                <div class="roadmap" id="lesson-roadmap"></div>
            </section>

            <section class="continue-panel">
                <div>
                    <p class="eyebrow">Continue learning</p>
                    <h2 id="continue-title">Your next lesson is ready</h2>
                    <p id="continue-description">
                        Jump back into the next unlocked lesson.
                    </p>
                </div>
                <a class="button primary" id="continue-card-button" href="#"
                    >Open Lesson</a
                >
            </section>

            <section
                class="course-browser-grid"
                id="course-detail"
                aria-label="Course lesson list"
            ></section>
        </main>

        <script src="/static/script.js?v=20260525a"></script>
        <script type="module">
            import {
                hydrateLessonProgressStorage,
                loadProgressSnapshot,
            } from "/static/components/progress-sync.js";
            import {
                courseLessons,
                courseProgress,
                findBracketByCourseId,
                findCourseById,
                isCourseLessonUnlocked,
                loadCurriculumData,
                nextUnlockedLesson,
            } from "/static/components/curriculum.js?v=20260525a";

            const progressKey = "freemate.completedLessons";
            const stepKey = "freemate.savedSteps";

            function loadSet(key) {
                try {
                    return new Set(JSON.parse(localStorage.getItem(key)) || []);
                } catch (error) {
                    return new Set();
                }
            }

            function loadObject(key, fallbackKey = null) {
                const merged = {};
                [fallbackKey, key].filter(Boolean).forEach((sourceKey) => {
                    try {
                        Object.assign(
                            merged,
                            JSON.parse(localStorage.getItem(sourceKey)) || {},
                        );
                    } catch (error) {
                        // Ignore malformed storage and keep the other source.
                    }
                });
                return merged;
            }

            const completedLessons = loadSet(progressKey);
            const savedSteps = loadObject(stepKey, "freemate.lessonSteps");
            const progressSnapshot = await loadProgressSnapshot();
            hydrateLessonProgressStorage(progressSnapshot, {
                completedLessons,
                savedSteps,
                progressKey,
                stepKeys: [stepKey, "freemate.lessonSteps"],
            });

            async function ensureCourseVisible() {
                const detail = document.getElementById("course-detail");
                if (!detail || detail.children.length) return;

                const { courses, brackets } = await loadCurriculumData();
                const courseId = window.location.pathname.split("/").pop();
                const course = findCourseById(courses, courseId) || courses[0];
                if (!course) return;

                const lessons = courseLessons(course);
                const bracket = findBracketByCourseId(brackets, course.id);
                const nextLesson =
                    nextUnlockedLesson(course, completedLessons) || lessons[0];
                const progress = courseProgress(course, completedLessons);

                document.getElementById("course-title").textContent =
                    course.title;
                document.getElementById("course-description").textContent =
                    course.description;
                document.getElementById("progress-count").textContent =
                    `${lessons.filter((lesson) => completedLessons.has(lesson.id)).length} of ${lessons.length} complete`;
                const fill = document.getElementById("progress-fill");
                if (fill) fill.style.width = `${progress}%`;
                if (bracket) {
                    const bracketTag = document.createElement("p");
                    bracketTag.className = "eyebrow";
                    bracketTag.textContent = `${bracket.title} · ${bracket.range}`;
                    const hero = document.querySelector(
                        ".course-browser-hero > div",
                    );
                    if (hero && !hero.querySelector(".course-bracket-tag")) {
                        bracketTag.classList.add("course-bracket-tag");
                        hero.insertBefore(bracketTag, hero.firstChild);
                    }
                }
                const nextHref = nextLesson
                    ? `/lessons/${nextLesson.id}`
                    : `/courses/${course.id}`;
                document.getElementById("continue-learning").href = nextHref;
                document.getElementById("continue-card-button").href = nextHref;
                document.getElementById("continue-title").textContent =
                    nextLesson ? nextLesson.title : "You are up to date";
                document.getElementById("continue-description").textContent =
                    nextLesson
                        ? nextLesson.description ||
                          "Open the next unlocked lesson to continue."
                        : "You have completed this course.";

                detail.innerHTML = course.categories
                    .map(
                        (category) => `
            <section class="course-category-card">
              <div class="category-heading">
                <div>
                  <p class="eyebrow">Category</p>
                  <h2>${category.title}</h2>
                  <p>${category.description}</p>
                </div>
              </div>
              <div class="lesson-row-list">
                ${category.skills
                    .flatMap((skill) =>
                        skill.lessons.map((lesson) => {
                            const unlocked = isCourseLessonUnlocked(
                                course,
                                lesson.id,
                                completedLessons,
                            );
                            const progress = completedLessons.has(lesson.id)
                                ? 100
                                : Math.round(
                                      ((savedSteps[lesson.id] || 0) /
                                          (lesson.steps?.length || 1)) *
                                          100,
                                  );
                            return `
                        <article class="lesson-row">
                          <div class="lesson-row-main">
                            <span class="lesson-state">${completedLessons.has(lesson.id) ? "Done" : unlocked ? "Open" : "Locked"}</span>
                            <h3>${lesson.title}</h3>
                            <p>${lesson.summary}</p>
                          </div>
                          <div class="lesson-row-meta">
                            <span>${lesson.difficulty}</span>
                            <span>${lesson.timeMinutes || 5} min</span>
                            <span>${lesson.ratingRange}</span>
                          </div>
                          <div class="lesson-row-progress">
                            <div class="progress-track"><div class="progress-fill" style="width: ${progress}%"></div></div>
                            <span>${progress}%</span>
                          </div>
                          <a class="button ${unlocked ? "primary" : "secondary"}" href="${unlocked ? `/lessons/${lesson.id}` : "#"}">${completedLessons.has(lesson.id) ? "Review" : unlocked ? "Open" : "Locked"}</a>
                        </article>
                      `;
                        }),
                    )
                    .join("")}
              </div>
            </section>
          `,
                    )
                    .join("");
            }

            ensureCourseVisible();
        </script>
        <script type="module" src="/static/components/mobile-nav.js"></script>
        <script type="module" src="/static/components/auth-ui.js"></script>
    </body>
</html>
