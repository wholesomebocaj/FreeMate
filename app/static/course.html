<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course | FreeMate</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="brand" href="/">FreeMate</a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/lessons">Lessons</a>
        <a href="/practice">Practice</a>
        <a href="/lessons#puzzles">Puzzles</a>
        <a href="/lessons#progress">Progress</a>
      </div>
    </nav>
  </header>

  <main class="course-browser-shell">
    <section class="course-browser-hero">
      <div>
        <p class="eyebrow">Course dashboard</p>
        <h1 id="course-title">Loading course...</h1>
        <p id="course-description">Preparing your lesson list.</p>
        <div class="hero-actions">
          <a class="button primary" id="continue-learning" href="#">Continue Learning</a>
          <a class="button secondary" href="/lessons">All Courses</a>
        </div>
      </div>
      <div class="coach-stats">
        <span id="progress-count">0 of 0 complete</span>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </section>

    <section class="roadmap-section compact" aria-label="Course roadmap">
      <div class="roadmap" id="lesson-roadmap"></div>
    </section>

    <section class="continue-panel">
      <div>
        <p class="eyebrow">Continue learning</p>
        <h2 id="continue-title">Your next lesson is ready</h2>
        <p id="continue-description">Jump back into the next unlocked lesson.</p>
      </div>
      <a class="button primary" id="continue-card-button" href="#">Open Lesson</a>
    </section>

    <section class="course-browser-grid" id="course-detail" aria-label="Course lesson list"></section>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
