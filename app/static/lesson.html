<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lesson | FreeMate</title>
        <link rel="stylesheet" href="/static/vendor/chessground/chessground.base.css" />
        <link rel="stylesheet" href="/static/vendor/chessground/chessground.cburnett.css" />
        <link rel="stylesheet" href="/static/styles.css" />
    </head>
    <body>
        <header class="site-header lesson-mode-header">
            <nav class="navbar" aria-label="Main navigation">
                <a class="brand" href="/">FreeMate</a>
                <div class="nav-links">
                    <a href="/">Home</a>
                    <a href="/lessons">Lessons</a>
                    <a href="/practice">Practice</a>
                    <a href="/lessons#puzzles">Puzzles</a>
                    <a href="/lessons#progress">Progress</a>
                </div>
            </nav>
        </header>

        <main class="lesson-mode-shell">
            <aside class="course-sidebar" aria-label="Course navigation">
                <div class="sidebar-title">
                    <p class="eyebrow">Course tree</p>
                    <h2>Beginner path</h2>
                </div>
                <div class="course-tree" id="course-tree"></div>
            </aside>

            <article class="lesson-stage" id="lesson-player" aria-live="polite">
                <p class="eyebrow">Interactive lesson</p>
                <h1>Loading lesson...</h1>
            </article>

            <aside class="lesson-notes" aria-label="Lesson notes">
                <div class="focus-card">
                    <p class="eyebrow">Objective</p>
                    <h2 id="lesson-objective">Learn the pattern</h2>
                    <p id="lesson-goal">
                        Follow the guided steps, then complete the exercise.
                    </p>
                </div>
                <div class="focus-card">
                    <p class="eyebrow">Lesson progress</p>
                    <h2 id="lesson-progress-label">Step 1</h2>
                    <div class="progress-track" aria-hidden="true">
                        <div
                            class="progress-fill"
                            id="lesson-progress-fill"
                        ></div>
                    </div>
                </div>
                <div class="focus-card">
                    <p class="eyebrow">Coach feedback</p>
                    <p class="result" id="side-feedback">
                        Make your first move when you are ready.
                    </p>
                </div>
            </aside>
        </main>

        <script type="module">
            import { LessonRenderer } from "/static/components/LessonRenderer.js";

            async function loadLesson() {
                const pathParts = window.location.pathname.split("/");
                const lessonId = pathParts[pathParts.length - 1];

                const response = await fetch("/api/course");
                const courses = await response.json();

                let lesson = null;

                for (const course of courses) {
                    for (const category of course.categories) {
                        for (const skill of category.skills) {
                            const foundLesson = skill.lessons.find(
                                (lessonItem) => lessonItem.id === lessonId,
                            );

                            if (foundLesson) {
                                lesson = foundLesson;
                                break;
                            }
                        }
                    }
                }

                const lessonPlayer = document.getElementById("lesson-player");

                if (!lesson) {
                    lessonPlayer.innerHTML = `
        <h1>Lesson not found</h1>
      `;
                    return;
                }

                document.getElementById("lesson-objective").textContent =
                    lesson.title || "Lesson";

                document.getElementById("lesson-goal").textContent =
                    lesson.description ||
                    "Follow the guided steps and complete the lesson.";

                const renderer = new LessonRenderer(lessonPlayer, lesson);

                renderer.render();
                renderCourseTree(courses, lessonId);
            }

            function renderCourseTree(courses, activeLessonId) {
                const tree = document.getElementById("course-tree");
                if (!tree) return;

                tree.innerHTML = "";

                courses.forEach((course) => {
                    course.categories.forEach((category) => {
                        const group = document.createElement("section");
                        group.className = "tree-category";
                        group.innerHTML = `<h3>${category.title}</h3>`;

                        category.skills.forEach((skill) => {
                            const block = document.createElement("div");
                            block.className = "tree-skill";
                            block.innerHTML = `<p>${skill.title}</p>`;

                            skill.lessons.forEach((lessonItem) => {
                                const link = document.createElement("a");
                                link.className = "tree-lesson";
                                link.href = `/lessons/${lessonItem.id}`;
                                link.setAttribute(
                                    "aria-current",
                                    String(lessonItem.id === activeLessonId),
                                );
                                link.innerHTML = `
                                    <span>${lessonItem.locked ? "Locked" : "Open"}</span>
                                    <strong>${lessonItem.title}</strong>
                                `;
                                block.appendChild(link);
                            });

                            group.appendChild(block);
                        });

                        tree.appendChild(group);
                    });
                });
            }

            loadLesson();
        </script>
    </body>
</html>
