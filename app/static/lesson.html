<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lesson | FreeMate</title>
        <link
            rel="stylesheet"
            href="/static/vendor/chessground/chessground.base.css"
        />
        <link
            rel="stylesheet"
            href="/static/vendor/chessground/chessground.cburnett.css"
        />
        <link rel="stylesheet" href="/static/styles.css" />
    </head>
    <body>
        <header class="site-header lesson-mode-header">
            <nav class="navbar" aria-label="Main navigation">
                <a class="brand" href="/">FreeMate</a>
                <div class="nav-links">
                    <a href="/">Home</a>
                    <a href="/lessons">Lessons</a>
                    <a href="/practice">Practice</a>
                    <a href="/lessons#puzzles">Puzzles</a>
                    <a href="/lessons#progress">Progress</a>
                </div>
            </nav>
        </header>

        <main class="lesson-mode-shell">
            <aside class="course-sidebar" aria-label="Course navigation">
                <div class="sidebar-title">
                    <p class="eyebrow">Course tree</p>
                    <h2>Beginner path</h2>
                </div>
                <div class="course-tree" id="course-tree"></div>
            </aside>

            <article class="lesson-stage" id="lesson-player" aria-live="polite">
                <p class="eyebrow">Interactive lesson</p>
                <h1>Loading lesson...</h1>
            </article>

            <aside class="lesson-notes" aria-label="Lesson notes">
                <div class="focus-card">
                    <p class="eyebrow">Objective</p>
                    <h2 id="lesson-objective">Learn the pattern</h2>
                    <p id="lesson-goal">
                        Follow the guided steps, then complete the exercise.
                    </p>
                </div>
                <div class="focus-card">
                    <p class="eyebrow">Lesson progress</p>
                    <h2 id="lesson-progress-label">Step 1</h2>
                    <div class="progress-track" aria-hidden="true">
                        <div
                            class="progress-fill"
                            id="lesson-progress-fill"
                        ></div>
                    </div>
                </div>
                <div class="focus-card">
                    <p class="eyebrow">Coach feedback</p>
                    <p class="result" id="side-feedback">
                        Make your first move when you are ready.
                    </p>
                </div>
            </aside>
        </main>

        <script type="module">
            import { PracticeBoard } from "/static/components/PracticeBoard.js";
            window.PracticeBoard = PracticeBoard;
        </script>
        <script src="/static/script.js"></script>
    </body>
</html>
